<text x="82" y="404" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#D7DAE1">Data sovereignty: private, local AI by default</text>
<text x="60" y="436" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#7BE0C9">→</text>
<text x="82" y="436" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#D7DAE1">Hands-on build: strategy that ships code</text>
<text x="60" y="468" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#7BE0C9">→</text>
<text x="82" y="468" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#D7DAE1">Proof: every claim carries a number and a source</text>
<rect x="512" y="322" width="452" height="186" rx="14" fill="#171A21" stroke="rgba(255,255,255,0.09)"/>
<rect x="512" y="322" width="452" height="4" rx="2" fill="#C6F432"/>
<text x="536" y="362" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1.6" fill="#C6F432">04</text>
<text x="568" y="364" font-family="'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="800" fill="#F3F4F6">Create</text>
<text x="536" y="404" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#C6F432">→</text>
<text x="558" y="404" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#D7DAE1">Self-check quiz that scores AI readiness</text>
<text x="536" y="436" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#C6F432">→</text>
<text x="558" y="436" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#D7DAE1">Machine layer for AI search (genome.json, llms.txt)</text>
<text x="536" y="468" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#C6F432">→</text>

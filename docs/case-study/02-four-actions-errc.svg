<text x="568" y="158" font-family="'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="800" fill="#F3F4F6">Reduce</text>
<text x="536" y="198" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#4CC3FF">→</text>
<text x="558" y="198" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#D7DAE1">Jargon in buyer-facing copy</text>
<text x="536" y="230" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#4CC3FF">→</text>
<text x="558" y="230" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#D7DAE1">Size of the first commitment (free self-check)</text>
<text x="536" y="262" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#4CC3FF">→</text>
<text x="558" y="262" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#D7DAE1">Reliance on generic stock imagery</text>

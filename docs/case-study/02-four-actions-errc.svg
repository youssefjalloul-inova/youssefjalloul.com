<text x="92" y="158" font-family="'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="800" fill="#F3F4F6">Eliminate</text>
<text x="60" y="198" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#FF7A2F">→</text>
<text x="82" y="198" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#D7DAE1">Slide-only deliverables with no working build</text>
<text x="60" y="230" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#FF7A2F">→</text>
<text x="82" y="230" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#D7DAE1">Lock-in to a single public-cloud model</text>
<text x="60" y="262" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#FF7A2F">→</text>
<text x="82" y="262" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#D7DAE1">Months of discovery before anything ships</text>
